name: Framework checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install "setuptools>=58" wheel packaging
      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Build and verify isolated installations
        run: python -B scripts/check_release.py
      - name: Verify independent adapter distributions
        run: python -B scripts/check_adapters.py
