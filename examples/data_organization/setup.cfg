[metadata]
name = gymts-data-organization-demo
version = 0.1.0
description = Independent four-source data organization example for GymTS
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    gymts>=0.5.1,<0.7
    gymts-timeseries>=0.2
    gymts-libraryts>=0.2
    gymts-interaction>=0.1
    gymts-gymnasium>=0.1
    gymts-prometheus>=0.1

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    gymts-data-organization-demo = gymts_data_organization_demo.cli:main
