[metadata]
name = gymts
version = 0.3.1
description = Reproducible time-series experiment and evaluation infrastructure
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Jurmean/GymTS
project_urls =
    Source = https://github.com/Jurmean/GymTS
    Issues = https://github.com/Jurmean/GymTS/issues

[options]
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
include =
    gymts
    gymts.*

[options.package_data]
gymts = py.typed

[options.extras_require]
yaml = PyYAML>=6.0

[options.entry_points]
console_scripts =
    gymts = gymts.cli:main
    gymts-chatts = gymts.integrations.chatts.pipeline:main

