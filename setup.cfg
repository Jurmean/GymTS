[metadata]
name = gymts
version = 0.6.0
description = Reproducible time-series experiment and evaluation infrastructure
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Jurmean/GymTS
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
project_urls =
    Source = https://github.com/Jurmean/GymTS
    Issues = https://github.com/Jurmean/GymTS/issues

[options]
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
include =
    gymts
    gymts.*

[options.package_data]
gymts = py.typed

[options.extras_require]
yaml = PyYAML>=6.0
datasets = pyarrow>=14

[options.entry_points]
console_scripts =
    gymts = gymts.cli:main
