[metadata]
name = gymts-itformer
version = 0.1.0
description = External ITFormer and EngineMT-QA adapters for frozen GymTS 0.5
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files =
    LICENSE
    UPSTREAM_LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    gymts>=0.5,<0.7
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
data =
    h5py>=3.10,<4
    numpy>=1.26,<2
runtime =
    h5py>=3.10,<4
    numpy>=1.26,<2
    torch>=2.5,<2.7
    transformers==4.47.1
    accelerate>=1.6,<2
    safetensors>=0.4.5,<1
    timm==1.0.12
    pandas>=2,<3
    einops>=0.8,<1

[options.entry_points]
gymts.integrations =
    itformer = gymts_itformer:register_itformer_plugins
console_scripts =
    gymts-itformer = gymts_itformer.cli:main
