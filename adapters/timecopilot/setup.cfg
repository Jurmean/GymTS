[metadata]
name = gymts-timecopilot
version = 0.1.0
description = Independent native TimeCopilot agent adapter for GymTS
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.7
    gymts-timeseries>=0.2,<0.3
include_package_data = False

[options.packages.find]
where = src
include =
    gymts_timecopilot
    gymts_timecopilot.*

[options.entry_points]
gymts.integrations =
    timecopilot = gymts_timecopilot:register_timecopilot_plugins
console_scripts =
    gymts-timecopilot = gymts_timecopilot.cli:main
