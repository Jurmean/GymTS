[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-timesigma
version = 0.2.0
description = Optional native TimeSigma adapter for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.7
include_package_data = False

[options.packages.find]
where = src
include =
    gymts_timesigma
    gymts_timesigma.*

[options.extras_require]
runtime =
    numpy>=1.24,<3

[options.entry_points]
gymts.integrations =
    timesigma = gymts_timesigma:register_timesigma_plugins
console_scripts =
    gymts-timesigma = gymts_timesigma.pipeline:main
