[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-prometheus
version = 0.1.0
description = Independent read-only Prometheus live Environment adapter for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.6

[options.packages.find]
where = src

[options.entry_points]
gymts.integrations =
    prometheus = gymts_prometheus:register
