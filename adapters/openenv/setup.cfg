[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-openenv
version = 0.1.0
description = External OpenEnv WebSocket sessions for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.6
    gymts-interaction>=0.1,<0.2
include_package_data = False

[options.packages.find]
where = src
include =
    gymts_openenv
    gymts_openenv.*

[options.extras_require]
sdk =
    openenv>=0.9,<0.10; python_version >= '3.10'

[options.entry_points]
gymts.integrations =
    openenv = gymts_openenv:register_openenv_plugins
