[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-timeseries
version = 0.2.0
description = Shared model-neutral time-series QA tasks, sources and scorers for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.7
include_package_data = False

[options.packages.find]
where = src
include =
    gymts_timeseries
    gymts_timeseries.*

[options.entry_points]
gymts.integrations =
    timeseries = gymts_timeseries:register_timeseries_plugins
