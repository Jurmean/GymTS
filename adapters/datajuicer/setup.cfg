[metadata]
name = gymts-datajuicer
version = 0.1.0
description = Independent native Data-Juicer execution and dataset-quality evaluation for GymTS
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    gymts>=0.5,<0.7

[options.packages.find]
where = src

[options.entry_points]
gymts.integrations =
    datajuicer = gymts_datajuicer:register_datajuicer_plugins
console_scripts =
    gymts-datajuicer = gymts_datajuicer.cli:main
