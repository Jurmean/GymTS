[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-bench-tsqa
version = 0.1.0
description = Evaluation-only time-series QA benchmark resources and adapters for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.6
include_package_data = True

[options.packages.find]
where = src
include =
    gymts_bench_tsqa
    gymts_bench_tsqa.*

[options.package_data]
gymts_bench_tsqa = cards/*.md

[options.extras_require]
runtime =
    pyarrow>=14

[options.entry_points]
gymts.integrations =
    bench-tsqa = gymts_bench_tsqa:register_bench_tsqa_plugins
console_scripts =
    gymts-bench-tsqa = gymts_bench_tsqa.cli:main
