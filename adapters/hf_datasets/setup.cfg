[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-hf-datasets
version = 0.1.0
description = Explicit Hugging Face static dataset freezing and forecast environments for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.7

[options.packages.find]
where = src

[options.extras_require]
runtime =
    datasets>=3.0,<5
    huggingface-hub>=0.28,<2

[options.entry_points]
gymts.integrations =
    hf-datasets = gymts_hf_datasets:register_hf_datasets_plugins
console_scripts =
    gymts-hf-datasets = gymts_hf_datasets.cli:main
