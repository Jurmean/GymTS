[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-interaction
version = 0.1.0
description = External project neutral interaction task and evidence scorer for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.6

[options.packages.find]
where = src

[options.entry_points]
gymts.integrations =
    interaction = gymts_interaction:register_interaction_plugins
