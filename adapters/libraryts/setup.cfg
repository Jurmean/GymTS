[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-libraryts
version = 0.2.0
description = Fixed-source LibraryTS tools and algorithms for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.6
    gymts-timeseries>=0.2,<0.3
include_package_data = False

[options.packages.find]
where = src
include =
    gymts_libraryts
    gymts_libraryts.*

[options.extras_require]
runtime =
    numpy>=1.24,<3
    pandas>=2,<3
    scikit-base>=0.12,<0.14
    scikit-learn>=1.2,<1.8
    scipy>=1.10,<2
    joblib>=1.2
    packaging>=23
analysis =
    statsmodels>=0.14,<0.15
    numba>=0.59

[options.entry_points]
gymts.integrations =
    libraryts = gymts_libraryts:register_libraryts_plugins
console_scripts =
    gymts-libraryts = gymts_libraryts.cli:main
