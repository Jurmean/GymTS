[metadata]
name = gymts-chronos
version = 0.1.0
description = External Chronos-2 probabilistic forecasting and training adapter for GymTS
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    gymts>=0.5,<0.7
    gymts-timeseries>=0.2,<0.3
include_package_data = False

[options.packages.find]
where = src

[options.extras_require]
runtime =
    chronos-forecasting @ git+https://github.com/amazon-science/chronos-forecasting.git@1224fafa91e1ecd6674f5204066b159e40b5e4a1
    torch>=2.2,<3
    transformers>=4.57,<5
    accelerate>=1.1,<2

[options.entry_points]
gymts.integrations =
    chronos = gymts_chronos:register
console_scripts =
    gymts-chronos = gymts_chronos.cli:main
