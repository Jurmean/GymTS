[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-gymnasium
version = 0.1.0
description = Independent Gymnasium simulation Environment adapter for GymTS
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.7
    gymts-interaction>=0.1,<0.2

[options.packages.find]
where = src

[options.extras_require]
runtime =
    gymnasium==1.2.1

[options.entry_points]
gymts.integrations =
    gymnasium = gymts_gymnasium:register_gymnasium_plugins
