[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-chatts
version = 0.2.0
description = ChatTS data, task, model and scoring adapters for GymTS
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Jurmean/GymTS

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.7
    gymts-timeseries>=0.2,<0.3
include_package_data = False

[options.packages.find]
where = src

[options.entry_points]
gymts.integrations =
    chatts = gymts_chatts:register_chatts_plugins
console_scripts =
    gymts-chatts = gymts_chatts.pipeline:main
