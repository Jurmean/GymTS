[metadata]
name = gymts-areal
version = 0.1.0
description = Independent sealed native AReaL TIR rollout and PPO bridge for GymTS
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    gymts>=0.5,<0.7
    gymts-rl>=0.2,<0.3
include_package_data = False

[options.packages.find]
where = src
include =
    gymts_areal
    gymts_areal.*

[options.entry_points]
gymts.integrations =
    areal = gymts_areal:register_areal_plugins
gymts.dataset_builders =
    gymts.areal.sealed-tir-builder = gymts_areal.builder:SealedTIRBuilder
console_scripts =
    gymts-areal = gymts_areal.cli:main
