[metadata]
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
name = gymts-rl
version = 0.2.0
description = Verifiable local language-model rollout and TRL training adapter for GymTS
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Jurmean/GymTS

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = False
install_requires =
    gymts>=0.5,<0.6

[options.packages.find]
where = src
include =
    gymts_rl
    gymts_rl.*

[options.extras_require]
runtime =
    torch>=2.6,<2.12
    transformers==4.52.4
    trl==0.18.2
    peft==0.15.2
    accelerate==1.7.0
    datasets==3.6.0
    numpy==1.26.4
    pyarrow==20.0.0
    pandas==2.2.3
    scipy>=1.11,<1.16
    PyYAML>=6.0
    pillow>=10,<12

[options.entry_points]
gymts.integrations =
    rl = gymts_rl:register_rl_plugins
gymts.dataset_builders =
    gymts.native-rollout-builder = gymts_rl.exporter:NativeRolloutBuilder
console_scripts =
    gymts-rl = gymts_rl.cli:main
